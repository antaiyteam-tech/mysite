  <button class="to-top" id="to-top" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script>
    // 向下滚动一小段后显示「回到顶部」，回到页面顶部时自动隐藏
    (function () {
      var btn = document.getElementById('to-top');
      var ticking = false;
      function update() { btn.classList.toggle('is-visible', window.scrollY > 160); ticking = false; }
      window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      btn.addEventListener('click', function () { window.scrollTo({ top: 0 }); }); // 平滑滚动由 CSS 的 scroll-behavior 控制
      update();
    })();
  </script>
  <script>
    // 复制按钮：先用剪贴板接口，不行就用旧方法；都不行就提示长按（部分内置浏览器不支持一键复制）
    (function () {
      function legacyCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }
      function selectText(node) {
        if (!node || !window.getSelection) return;
        var r = document.createRange(); r.selectNodeContents(node);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
      Array.prototype.forEach.call(document.querySelectorAll('.copy-btn[data-copy]'), function (b) {
        var label = b.textContent, timer;
        function flash(msg) {
          b.textContent = msg;
          clearTimeout(timer);
          timer = setTimeout(function () { b.textContent = label; }, 1800);
        }
        b.addEventListener('click', function () {
          var text = b.getAttribute('data-copy');
          function fallback() {
            if (legacyCopy(text)) { flash(b.getAttribute('data-done')); }
            else { selectText(b.nextElementSibling); flash(b.getAttribute('data-fail')); }
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { flash(b.getAttribute('data-done')); }, fallback);
          } else { fallback(); }
        });
      });
    })();
  </script>
