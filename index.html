<body>

      <a class="brand" href="index.html" aria-label="Back to home"><img class="mark-img" src="antaiy-logo.svg?v=2" width="42" height="42" alt=""><span class="brand-text">antaiy AI Co-creation</span></a>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-title">
          <h1><span>Mentor Matching</span> <span>&amp; Incubation</span></h1>
        </div>

        <figure class="hero-figure">
          <svg class="hex" id="hex" viewBox="-625 -545 1330 1090" role="img" aria-label="Hexagon matching diagram: master mentor and protégé, patron and everyday hero, dark horse and talent scout, matched in pairs">
            <circle class="ring" r="400"/>

            <!-- 虚线：每条线的颜色取对面顶点的颜色 -->
            <g class="dashes">
              <line class="dash c-blue"  x1="-346.41" y1="-200" x2="346.41" y2="-200"/>
              <line class="dash c-red"   x1="346.41"  y1="-200" x2="0"      y2="400"/>
              <line class="dash c-green" x1="0"       y1="400"  x2="-346.41" y2="-200"/>
              <line class="dash c-red"   x1="0"       y1="-400" x2="-346.41" y2="200"/>
              <line class="dash c-blue"  x1="-346.41" y1="200"  x2="346.41" y2="200"/>
              <line class="dash c-green" x1="346.41"  y1="200"  x2="0"      y2="-400"/>
            </g>

            <!-- 标志：外层负责淡入，三只蚂蚁转动，Ai 保持不动 -->
            <g class="taiji">
              <defs>
                <clipPath id="hcM"><circle cx="150" cy="132.4" r="46"/></clipPath>
                <clipPath id="hcY"><circle cx="165.24" cy="158.8" r="46"/></clipPath>
              </defs>
              <g transform="scale(0.934)">
                <g class="logo-spin">
                  <g transform="translate(-150 -150)">
                    <circle cx="150" cy="132.4" r="46" fill="#E5007D"/><circle cx="150" cy="54" r="28.4" fill="#E5007D"/><circle cx="150" cy="4" r="17.6" fill="#E5007D"/>
                    <circle cx="165.24" cy="158.8" r="46" fill="#FFD500"/><circle cx="233.14" cy="198" r="28.4" fill="#FFD500"/><circle cx="276.44" cy="223" r="17.6" fill="#FFD500"/>
                    <circle cx="134.76" cy="158.8" r="46" fill="#00A0E3"/><circle cx="66.86" cy="198" r="28.4" fill="#00A0E3"/><circle cx="23.56" cy="223" r="17.6" fill="#00A0E3"/>
                    <g clip-path="url(#hcM)"><circle cx="165.24" cy="158.8" r="46" fill="#E8381B"/></g>
                    <g clip-path="url(#hcM)"><circle cx="134.76" cy="158.8" r="46" fill="#2E3192"/></g>
                    <g clip-path="url(#hcY)"><circle cx="134.76" cy="158.8" r="46" fill="#00A651"/></g>
                    <g clip-path="url(#hcM)"><g clip-path="url(#hcY)"><circle cx="134.76" cy="158.8" r="46" fill="#0A0A0A"/></g></g>
                  </g>
                </g>
                <g transform="scale(0.9) translate(-149.5 -153)">
                  <path d="M132 168 L143 137 L154 168 M136.5 158 L149.5 158" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="166" cy="139" r="4.4" fill="#FFFFFF"/>
                  <path d="M166 150 L166 168" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
                </g>
              </g>
            </g>

            <!-- 顶点和名称 -->
            <g class="node c-blue"><circle cx="0" cy="-400" r="28"/><text class="label" x="0" y="-455" text-anchor="middle">Master Mentor</text></g>
            <g class="node c-green"><circle cx="346.41" cy="-200" r="28"/><text class="label" x="390" y="-218" text-anchor="start">Everyday<tspan x="390" dy="62">Hero</tspan></text></g>
            <g class="node c-red"><circle cx="346.41" cy="200" r="28"/><text class="label" x="390" y="182" text-anchor="start">Talent<tspan x="390" dy="62">Scout</tspan></text></g>
            <g class="node c-blue"><circle cx="0" cy="400" r="28"/><text class="label" x="0" y="509" text-anchor="middle">Protégé</text></g>
            <g class="node c-green"><circle cx="-346.41" cy="200" r="28"/><text class="label" x="-390" y="225" text-anchor="end">Patron</text></g>
            <g class="node c-red"><circle cx="-346.41" cy="-200" r="28"/><text class="label" x="-390" y="-218" text-anchor="end">Dark<tspan x="-390" dy="62">Horse</tspan></text></g>
          </svg>
        </figure>

        <div class="hero-cta">
          <a class="btn" href="biaodan.html">Get Matched</a>
          <a class="btn btn-ghost" href="contact.html">Contact Us</a>

  <script>
    // 字体就绪后再开始动画，避免名称闪一下换字体；最多等 1.2 秒
    (function () {
      var hex = document.getElementById('hex');
      var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.race([ready, new Promise(function (r) { setTimeout(r, 1200); })]).then(function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () { hex.classList.add('play'); }); });
      });
    })();
  </script>
</body>
